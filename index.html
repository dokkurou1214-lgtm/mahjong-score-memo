<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c28"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>麻雀戦績メモ</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#17312d;background:#f3f6f3}*{box-sizing:border-box}body{margin:0}.shell{max-width:600px;margin:auto;min-height:100dvh;padding:16px 16px 96px}header{background:#102c28;color:white;margin:-16px -16px 18px;padding:26px 20px 22px;border-radius:0 0 25px 25px}header .sub{font-size:12px;letter-spacing:.1em;opacity:.7}h1{margin:5px 0 0;font-size:25px}h2{font-size:17px;margin:0 0 12px}.panel{background:white;border:1px solid #e0e8e3;box-shadow:0 2px 14px #153e2810;border-radius:18px;padding:17px;margin:15px 0}.label{font-size:13px;font-weight:800;margin:18px 0 8px}.label:first-of-type{margin-top:2px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.choices.place{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{background:#f3f6f4;border:2px solid transparent;color:#25463d;font:700 16px inherit;font-size:17px;font-weight:800;border-radius:12px;min-height:55px;cursor:pointer}.place .choice{font-size:14px}.choice[aria-pressed="true"]{background:#e5f1eb;border-color:#218164;color:#126047}.inputrow{display:flex;gap:10px;align-items:stretch}.score{font-size:29px;font-weight:750;width:100%;min-width:0;padding:12px 14px;border:2px solid #ceddd3;border-radius:13px;background:white;color:#16342c}.score:focus{outline:3px solid #a7dcc5;border-color:#238267}.suffix{display:flex;flex-direction:column;justify-content:center;min-width:92px;text-align:right;font-size:13px;color:#658276}.converted{font-weight:850;font-size:18px;color:#143e31}.muted{font-size:12px;color:#6c8278}.dateLine{display:flex;justify-content:space-between;align-items:center;gap:10px}.dateLine input{font:inherit;color:#264e40;padding:8px;border:1px solid #dce7e0;border-radius:9px;max-width:170px}.primary{width:100%;border:0;background:#14765a;color:white;border-radius:13px;padding:17px;font-size:18px;font-weight:800;margin-top:18px;cursor:pointer}.primary:disabled{opacity:.45}.tabs{display:flex;background:#e9eeeb;padding:5px;border-radius:15px;gap:4px}.tab{border:0;background:transparent;color:#688176;flex:1;padding:12px 0;border-radius:11px;font-size:14px;font-weight:750}.tab.active{background:white;color:#135d46;box-shadow:0 1px 5px #0001}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eef5f0;border-radius:12px;text-align:center;padding:13px 5px}.stat b{font-size:21px;display:block;color:#164e3b}.stat span{font-size:11px;color:#6e8477}.rowentry{display:flex;align-items:center;gap:9px;padding:13px 0;border-bottom:1px solid #ecf0ed}.rowentry:last-child{border:0}.rank{min-width:44px;font-weight:850;font-size:19px;color:#176b51}.details{flex:1;min-width:0}.details strong{display:block;font-size:15px}.details small{color:#71857d;font-size:12px}.smallbtn{border:1px solid #dbe6df;background:white;color:#436657;border-radius:9px;padding:8px;font-weight:700}.filter{width:100%;padding:11px;border:1px solid #d4e3d9;border-radius:10px;font-size:15px;background:white}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.outline{border:1px solid #b9d3c4;color:#17664d;border-radius:10px;background:white;padding:11px 13px;font-weight:750}.danger{color:#aa3030;border-color:#e7c4c4}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b30;color:white;border-radius:12px;padding:14px 20px;display:none;max-width:90%;text-align:center;box-shadow:0 5px 18px #0003}.toast.show{display:block}.note{line-height:1.6;color:#697f73;font-size:12px}.empty{color:#789084;text-align:center;padding:20px 0}button{touch-action:manipulation}button:focus-visible{outline:3px solid #6bbd93}input[type=file]{display:none}
</style></head><body><main class="shell"><header><div class="sub">MAHJONG SCORE LOG</div><h1>麻雀戦績メモ</h1></header><nav class="tabs" aria-label="画面切替"><button class="tab active" data-tab="entry">記録する</button><button class="tab" data-tab="history">履歴</button><button class="tab" data-tab="stats">集計・保存</button></nav>
<section id="entry"><div class="panel"><h2 id="formTitle">1半荘を記録</h2><div class="label">着順</div><div id="ranks" class="choices" role="group" aria-label="着順"><button class="choice" data-rank="1" aria-pressed="false">1位</button><button class="choice" data-rank="2" aria-pressed="false">2位</button><button class="choice" data-rank="3" aria-pressed="false">3位</button><button class="choice" data-rank="4" aria-pressed="false">4位</button></div><div class="label">実戦場所</div><div id="places" class="choices place" role="group" aria-label="実戦場所"><button class="choice" data-place="天鳳" aria-pressed="false">天鳳</button><button class="choice" data-place="雀魂" aria-pressed="false">じゃんたま</button><button class="choice" data-place="フリー雀荘" aria-pressed="false">フリー雀荘</button></div><div class="label"><label for="score">点数（100点単位で入力）</label></div><div class="inputrow"><input id="score" class="score" type="text" inputmode="numeric" pattern="-?[0-9]*" placeholder="例：181" autocomplete="off"><div class="suffix"><span>実際の点数</span><span id="converted" class="converted">— 点</span></div></div><p class="muted">例：181 → 18,100点 ／ -25 → -2,500点</p><div class="dateLine"><label class="label" for="date">対局日（自動）</label><input type="date" id="date"></div><button class="primary" id="save">記録を保存</button><button class="outline hidden" id="cancelEdit" style="margin-top:10px;width:100%">編集をやめる</button></div><p class="note">入力後は着順だけ初期化し、実戦場所と日付は維持します。続けて記録するときの操作を減らしています。</p></section>
<section id="history" class="hidden"><div class="panel"><h2>記録履歴</h2><select id="historyPlace" class="filter" aria-label="場所で絞り込み"><option value="">すべての実戦場所</option><option value="天鳳">天鳳</option><option value="雀魂">じゃんたま</option><option value="フリー雀荘">フリー雀荘</option></select><div id="historyList"></div></div></section>
<section id="stats" class="hidden"><div class="panel"><h2>戦績集計</h2><select id="statPlace" class="filter" aria-label="場所別集計"><option value="">すべての実戦場所</option><option value="天鳳">天鳳</option><option value="雀魂">じゃんたま</option><option value="フリー雀荘">フリー雀荘</option></select><div class="summary" style="margin-top:12px"><div class="stat"><b id="total">0</b><span>記録件数</span></div><div class="stat"><b id="avgRank">—</b><span>平均着順</span></div><div class="stat"><b id="avgScore">—</b><span>平均点数</span></div></div><div id="rankDist" class="note" style="margin-top:12px"></div></div><div class="panel"><h2>バックアップ</h2><p class="note">データはこのスマホのブラウザ内に保存します。ブラウザのデータ削除や機種変更に備えて定期的にCSVファイルを保存してください。</p><div class="actions"><button id="exportCsv" class="outline">CSVを書き出す</button><button id="importCsv" class="outline">CSVを読み込む</button><input type="file" id="csvFile" accept=".csv,text/csv"></div><p class="note">読み込みは現在のデータに追加します。同じ記録IDは重複登録しません。</p></div></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';const KEY='mahjong-score-memo-v1';const $=s=>document.querySelector(s);let records=[];try{let raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))records=raw}catch{}let rank=null,place=localStorage.getItem('mahjong-place')||null,editId=null;const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};$('#date').value=today();const fmt=n=>Math.round(n).toLocaleString('ja-JP');function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch{alert('保存できません。ストレージの空き容量やブラウザ設定を確認してください。');return false}}function setRank(v){rank=v;document.querySelectorAll('[data-rank]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.rank===rank)))}function setPlace(v){place=v;document.querySelectorAll('[data-place]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.place===place)));if(v)localStorage.setItem('mahjong-place',v)}function scoreValue(){const s=$('#score').value.trim();return /^-?\d+$/.test(s)?Number(s)*100:null}function conversion(){const n=scoreValue();$('#converted').textContent=n===null?'— 点':`${fmt(n)} 点`}function tab(which){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===which));['entry','history','stats'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==which));if(which==='history')renderHistory();if(which==='stats')renderStats();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>setRank(+b.dataset.rank));document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>setPlace(b.dataset.place));$('#score').addEventListener('input',conversion);setPlace(place);
function resetForm(){editId=null;setRank(null);$('#score').value='';conversion();$('#formTitle').textContent='1半荘を記録';$('#save').textContent='記録を保存';$('#cancelEdit').classList.add('hidden');$('#date').value=today()}
$('#save').onclick=()=>{const pts=scoreValue(),date=$('#date').value;if(!rank)return toast('着順を選んでください');if(!place)return toast('実戦場所を選んでください');if(pts===null||!Number.isSafeInteger(pts))return toast('点数を数字で入力してください');if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('日付を確認してください');const now=new Date().toISOString();if(editId){let r=records.find(x=>x.id===editId);if(!r)return toast('編集対象が見つかりません');Object.assign(r,{rank,place,score:pts,date});if(!persist())return;toast('記録を更新しました')}else{records.unshift({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random()),rank,place,score:pts,date,createdAt:now});if(!persist()){records.shift();return}toast('記録しました')}resetForm()};$('#cancelEdit').onclick=resetForm;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filtered(sel){return records.filter(r=>!sel||r.place===sel)}function renderHistory(){const items=filtered($('#historyPlace').value).slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''));$('#historyList').innerHTML=items.length?items.map(r=>`<div class="rowentry"><div class="rank">${r.rank}位</div><div class="details"><strong>${fmt(r.score)}点</strong><small>${safe(r.date)} · ${safe(r.place)}</small></div><button class="smallbtn" data-edit="${safe(r.id)}">編集</button><button class="smallbtn" data-delete="${safe(r.id)}" aria-label="削除">削除</button></div>`).join(''):'<div class="empty">まだ記録がありません</div>'}$('#historyPlace').onchange=renderHistory;$('#historyList').onclick=e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){let r=records.find(x=>x.id===edit.dataset.edit);if(!r)return;editId=r.id;setRank(r.rank);setPlace(r.place);$('#score').value=String(r.score/100);$('#date').value=r.date;conversion();$('#formTitle').textContent='記録を編集';$('#save').textContent='変更を保存';$('#cancelEdit').classList.remove('hidden');tab('entry')}if(del){const r=records.find(x=>x.id===del.dataset.delete);if(r&&confirm(`${r.date} ${r.rank}位 ${fmt(r.score)}点を削除しますか？`)){records=records.filter(x=>x.id!==r.id);if(persist()){renderHistory();toast('削除しました')}}}};
function renderStats(){const rows=filtered($('#statPlace').value),len=rows.length;$('#total').textContent=fmt(len);$('#avgRank').textContent=len?(rows.reduce((n,r)=>n+r.rank,0)/len).toFixed(2):'—';$('#avgScore').textContent=len?fmt(rows.reduce((n,r)=>n+r.score,0)/len):'—';$('#rankDist').textContent=len?[1,2,3,4].map(k=>`${k}位：${rows.filter(r=>r.rank===k).length}回 (${(rows.filter(r=>r.rank===k).length/len*100).toFixed(1)}%)`).join('　'):'記録がまだありません'}$('#statPlace').onchange=renderStats;
function csvCell(x){return '"'+String(x).replace(/"/g,'""')+'"'}$('#exportCsv').onclick=()=>{const header=['id','date','place','rank','score','createdAt'];const csv='\ufeff'+[header.join(','),...records.map(r=>header.map(k=>csvCell(r[k]??'')).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`麻雀戦績_${today()}.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('#importCsv').onclick=()=>$('#csvFile').click();function parseCSV(s){s=s.replace(/^\ufeff/,'');const rows=[],line=[];let cur='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(quoted){if(c==='"'&&s[i+1]==='"'){cur+='"';i++}else if(c==='"')quoted=false;else cur+=c}else if(c==='"')quoted=true;else if(c===','){line.push(cur);cur=''}else if(c==='\r'||c==='\n'){line.push(cur);if(line.some(x=>x!==''))rows.push(line.slice());line.length=0;cur='';if(c==='\r'&&s[i+1]==='\n')i++}else cur+=c}if(quoted)throw Error('CSVの引用符が閉じていません');line.push(cur);if(line.some(x=>x!==''))rows.push(line);return rows}$('#csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const table=parseCSV(await f.text()),fields=table.shift();if(!fields||!['id','date','place','rank','score'].every(k=>fields.includes(k)))throw Error('CSVの列名が違います');const used=new Set(records.map(r=>r.id));let count=0;const add=[];for(const row of table){const r=Object.fromEntries(fields.map((f,i)=>[f,row[i]??'']));r.rank=Number(r.rank);r.score=Number(r.score);if(!r.id||!/^\d{4}-\d\d-\d\d$/.test(r.date)||!['天鳳','雀魂','フリー雀荘'].includes(r.place)||![1,2,3,4].includes(r.rank)||!Number.isSafeInteger(r.score)||r.score%100!==0)throw Error('不正なデータがあります');if(!used.has(r.id)){add.push(r);used.add(r.id);count++}}records=add.concat(records);if(persist())toast(`${count}件を読み込みました`)}catch(err){alert('CSVを読み込めませんでした：'+err.message)}finally{e.target.value=''}};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
